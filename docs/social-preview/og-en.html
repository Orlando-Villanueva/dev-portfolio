<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=1200, initial-scale=1" />
        <title>Managed websites: English social preview</title>
        <style>
            :root {
                --navy: #122033;
                --accent: #2563eb;
                --paper: #f4f7f8;
                --steel: #52606d;
                --confirm: #14805e;
                --white: #ffffff;
                --line: rgb(82 96 109 / 18%);
            }

            * {
                box-sizing: border-box;
            }

            html,
            body {
                width: 1200px;
                height: 630px;
                margin: 0;
                overflow: hidden;
            }

            body {
                background: var(--paper);
                color: var(--navy);
                font-family: Helvetica, Arial, sans-serif;
                -webkit-font-smoothing: antialiased;
            }

            .canvas {
                position: relative;
                width: 1200px;
                height: 630px;
                overflow: hidden;
                background:
                    linear-gradient(135deg, rgb(255 255 255 / 62%), transparent 48%),
                    var(--paper);
            }

            .canvas::before {
                position: absolute;
                inset: 0 auto 0 0;
                width: 520px;
                background: var(--navy);
                content: "";
            }

            .canvas::after {
                position: absolute;
                top: -180px;
                left: 300px;
                width: 430px;
                height: 430px;
                border: 1px solid rgb(37 99 235 / 28%);
                border-radius: 50%;
                box-shadow:
                    0 0 0 36px rgb(37 99 235 / 7%),
                    0 0 0 72px rgb(37 99 235 / 5%);
                content: "";
            }

            .brand {
                position: absolute;
                top: 44px;
                left: 64px;
                color: var(--white);
                font-size: 32px;
                font-weight: 700;
                letter-spacing: -0.02em;
            }

            .brand span {
                color: var(--accent);
            }

            .copy {
                position: absolute;
                top: 122px;
                left: 64px;
                z-index: 1;
                width: 438px;
            }

            h1 {
                margin: 0;
                color: var(--white);
                font-family: "Arial Narrow", "Helvetica Neue", Helvetica, Arial, sans-serif;
                font-size: 64px;
                font-stretch: condensed;
                font-weight: 800;
                letter-spacing: -0.035em;
                line-height: 0.9;
            }

            h1 span {
                display: block;
            }

            .subline {
                display: inline-flex;
                margin: 30px 0 0;
                padding: 11px 15px 12px;
                background: var(--accent);
                color: var(--white);
                font-size: 28px;
                font-weight: 700;
                letter-spacing: -0.02em;
                line-height: 1;
            }

            .signature {
                position: absolute;
                bottom: 26px;
                left: 64px;
                color: rgb(255 255 255 / 68%);
                font-size: 18px;
                font-weight: 600;
                letter-spacing: 0.02em;
            }

            .mockup-wrap {
                position: absolute;
                top: 96px;
                right: 40px;
                z-index: 2;
                width: 640px;
            }

            .mockup {
                overflow: hidden;
                border: 1px solid rgb(82 96 109 / 23%);
                border-radius: 8px;
                background: var(--white);
                box-shadow: 0 28px 54px rgb(18 32 51 / 21%);
            }

            .browser-chrome {
                display: flex;
                align-items: center;
                gap: 20px;
                min-height: 72px;
                padding: 0 22px;
                border-bottom: 1px solid var(--line);
                background: #e7edf2;
            }

            .window-dots {
                display: flex;
                flex: 0 0 auto;
                gap: 10px;
            }

            .window-dot {
                width: 16px;
                height: 16px;
                border-radius: 50%;
            }

            .window-dot--red {
                background: #ff5f57;
            }

            .window-dot--yellow {
                background: #febc2e;
            }

            .window-dot--green {
                background: #28c840;
            }

            .address-bar {
                display: flex;
                flex: 1;
                align-items: center;
                justify-content: center;
                min-height: 42px;
                padding: 0 20px;
                border: 1px solid rgb(82 96 109 / 18%);
                border-radius: 8px;
                background: var(--white);
                color: var(--steel);
                font-size: 28px;
                font-weight: 700;
                letter-spacing: -0.02em;
                line-height: 1;
            }

            .mockup-top {
                display: flex;
                align-items: center;
                justify-content: space-between;
                min-height: 76px;
                padding: 0 26px;
                border-bottom: 1px solid var(--line);
                font-size: 28px;
                font-weight: 700;
            }

            .mockup-body {
                display: block;
                min-height: 332px;
                padding: 42px 40px 38px;
                background: var(--paper);
            }

            .mockup h2 {
                max-width: 480px;
                margin: 0;
                font-family: "Arial Narrow", "Helvetica Neue", Helvetica, Arial, sans-serif;
                font-size: 52px;
                font-stretch: condensed;
                font-weight: 800;
                letter-spacing: -0.025em;
                line-height: 0.92;
            }

            .mockup-main {
                display: flex;
                min-height: 252px;
                flex-direction: column;
            }

            .mockup-actions {
                display: flex;
                align-items: center;
                flex-wrap: nowrap;
                gap: 28px;
                margin-top: auto;
                padding-top: 28px;
            }

            .mockup-cta {
                display: inline-flex;
                flex: 0 0 auto;
                padding: 14px 20px;
                background: var(--accent);
                color: var(--white);
                font-size: 28px;
                font-weight: 700;
                line-height: 1;
            }

            .mockup-aside {
                flex: 0 0 auto;
                padding-left: 22px;
                border-left: 3px solid rgb(37 99 235 / 40%);
            }

            .mockup-rating {
                margin: 0;
                color: var(--navy);
                font-size: 30px;
                font-weight: 700;
                letter-spacing: 0.02em;
                line-height: 1;
                white-space: nowrap;
            }

        </style>
    </head>
    <body>
        <main class="canvas" id="canvas">
            <div class="brand">Orlando<span>_</span></div>

            <section class="copy" aria-label="Social preview message">
                <h1>
                    <span>A website that</span>
                    <span>brings you</span>
                    <span>customers,</span>
                    <span>without you</span>
                    <span>having to think</span>
                    <span>about it.</span>
                </h1>
                <p class="subline">$79/month, fully managed</p>
            </section>

            <section class="mockup-wrap" aria-label="Sample service business website">
                <div class="mockup">
                    <div class="browser-chrome" aria-label="Browser window">
                        <div class="window-dots" aria-hidden="true">
                            <span class="window-dot window-dot--red"></span>
                            <span class="window-dot window-dot--yellow"></span>
                            <span class="window-dot window-dot--green"></span>
                        </div>
                        <div class="address-bar">yoursite.ca</div>
                    </div>
                    <header class="mockup-top">
                        <span>Northline Home Services</span>
                    </header>
                    <div class="mockup-body">
                        <div class="mockup-main">
                            <h2>Reliable home maintenance, without the runaround.</h2>
                            <div class="mockup-actions">
                                <span class="mockup-cta">Request service</span>
                                <div class="mockup-aside">
                                    <p class="mockup-rating">★★★★★</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <p class="signature">Orlando Villanueva</p>
        </main>
    </body>
</html>
